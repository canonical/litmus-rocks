# upstream: https://github.com/litmuschaos/chaos-runner/blob/master/build/Dockerfile

name: litmuschaos-runner
summary: Petrified litmuschaos-runner.
description: "Litmus Chaos runner that executes chaos experiments in target pods."
version: "3.29.0"
base: ubuntu@26.04
license: Apache-2.0
services:
  chaos-runner:
    command: chaos-runner
    override: replace
    startup: enabled
    on-success: shutdown
    on-failure: ignore
platforms:
  amd64:
parts:
  litmuschaos-runner:
    plugin: go
    source: https://github.com/litmuschaos/chaos-runner
    source-type: git
    source-tag: "3.29.0"
    source-depth: 1
    build-snaps:
      - go/1.26/stable
    build-environment:
      - CGO_ENABLED: "0"
    go-buildtags:
      - osusergo
      - netgo
    go-generate:
      - ./
    override-build: |
      # security: bump deps with reachable CVEs (grpc, otel, x/net); drop the
      # upstream replace pinning x/net to v0.17.0 which blocks the grpc bump
      go mod edit -dropreplace=golang.org/x/net
      go get google.golang.org/grpc@v1.79.3 go.opentelemetry.io/otel@v1.43.0 go.opentelemetry.io/otel/sdk@v1.43.0 golang.org/x/net@v0.55.0
      go mod tidy
      CGO_ENABLED=0 go build -buildvcs=false -o "${CRAFT_PART_INSTALL}/bin/chaos-runner" -v ./bin
    stage:
      - bin/chaos-runner
  ca-certs:
    plugin: nil
    overlay-packages: [ca-certificates]
  deb-security-manifest:
    after:
      - litmuschaos-runner
      - ca-certs
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
