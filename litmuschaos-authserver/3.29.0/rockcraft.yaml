# upstream: https://github.com/litmuschaos/litmus/blob/master/chaoscenter/authentication/Dockerfile

name: litmuschaos-authserver
summary: Petrified litmuschaos-authserver.
description: Litmus authentication server
version: "3.29.0"
base: ubuntu@26.04
license: Apache-2.0
services:
  auth:
    command: bin/server
    override: replace
    startup: enabled
platforms:
  amd64:
parts:
  litmuschaos-authserver:
    plugin: go
    source: https://github.com/litmuschaos/litmus
    source-type: git
    source-tag: "3.29.0"
    source-depth: 1
    build-snaps:
      - go/1.26/stable
    build-environment:
      - CGO_ENABLED: "0"
    override-build: |
      cd chaoscenter/authentication
      CGO_ENABLED=0 go build -o "${CRAFT_PART_INSTALL}/bin/server" -v ./api/
      # the litmus charm reads /VERSION to detect the workload version
      echo "$(craftctl get version)" > ${CRAFT_PART_INSTALL}/VERSION
    stage:
      - bin/server
      - VERSION
  ca-certs:
    plugin: nil
    overlay-packages: [ca-certificates]
  deb-security-manifest:
    after:
      - litmuschaos-authserver
      - ca-certs
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
