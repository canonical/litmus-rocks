# upstream: https://github.com/litmuschaos/litmus/blob/master/chaoscenter/graphql/server/Dockerfile

name: litmuschaos-server
summary: Petrified litmuschaos-server.
description: "Litmus server AKA 'graphql server'."
version: "3.29.0"
base: ubuntu@26.04
license: Apache-2.0
services:
  backend:
    command: server
    override: replace
    # it will start and error out immediately: it needs several
    # other components and configurations to function properly.
    startup: enabled
platforms:
  amd64:
parts:
  litmuschaos-server:
    plugin: go
    source: https://github.com/litmuschaos/litmus
    source-type: git
    source-tag: "3.29.0"
    source-depth: 1
    source-subdir: chaoscenter/graphql/server
    build-snaps:
      - go/1.26/stable
    override-build: |
      cp -r chaoscenter/graphql/server/manifests ${CRAFT_PART_INSTALL}
      # security: bump deps with reachable CVEs (argo-workflows, go-git, go-billy)
      (cd chaoscenter/graphql/server \
        && go get github.com/argoproj/argo-workflows/v3@v3.7.14 \
        && go get github.com/go-git/go-git/v5@v5.19.0 github.com/go-git/go-billy/v5@v5.9.0 \
        && go mod tidy)
      craftctl default
      # the litmus charm reads /VERSION to detect the workload version
      echo "$(craftctl get version)" > ${CRAFT_PART_INSTALL}/VERSION
    stage:
      - bin/server
      - manifests/*
      - VERSION
  ca-certs:
    plugin: nil
    overlay-packages: [ca-certificates]
  deb-security-manifest:
    after:
      - litmuschaos-server
      - ca-certs
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
